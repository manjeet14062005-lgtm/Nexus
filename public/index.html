    <style>
      #nexus-startup-loader{position:fixed;inset:0;z-index:2147483000;display:grid;place-content:center;justify-items:center;gap:18px;background:#f8f9fc;color:#18283f;font:500 15px/1.5 system-ui,sans-serif;opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s ease}
      .nexus-landing-booting #nexus-startup-loader{opacity:1;visibility:visible}
      .nexus-landing-booting #root{visibility:hidden}
      html.nexus-landing-booting,html.nexus-landing-booting body{overflow:hidden}
      .nexus-startup-orbit{width:64px;height:64px;display:grid;place-items:center;position:relative}
      .nexus-startup-orbit:before{content:'';position:absolute;inset:0;border:2px solid #e0e6f2;border-top-color:#355bc3;border-right-color:#9c92cf;border-radius:50%;animation:nexus-startup-spin 1s linear infinite}
      .nexus-startup-orbit img{width:30px;height:30px}
      #nexus-startup-loader p{margin:0;letter-spacing:.02em}
      .nexus-startup-help{font-size:13px;color:#52627a;opacity:0;animation:nexus-startup-help 0s 15s forwards}
      .nexus-startup-help a{color:#355bc3;text-underline-offset:3px}
      @keyframes nexus-startup-spin{to{transform:rotate(360deg)}}
      @keyframes nexus-startup-help{to{opacity:1}}
      @media(prefers-reduced-motion:reduce){#nexus-startup-loader{transition:none}.nexus-startup-orbit:before{animation:none;border-top-color:#355bc3}}
    </style>

    <noscript><h1>Nexus — Trust opens everything.</h1><p>Email and phone verification, analytics, webhooks and team roles in one connected workspace. Enable JavaScript to use the interactive application.</p><a href="/register">Get started</a> · <a href="/login">Sign in</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></noscript>

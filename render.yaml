# Bootstrap creates the two service addresses first. Add hosted URL and signup-hook
# settings privately in Render before the first successful release (see README).
services:
  - type: web
    name: nexus-frontend
    runtime: static
    buildCommand: npm ci --include=dev && npm run build:release
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXUS_RELEASE_BUILD
        value: "true"
      - key: REACT_APP_SUPABASE_URL
        sync: false
      - key: REACT_APP_SUPABASE_PUBLISHABLE_KEY
        sync: false
  - type: web
    name: nexus-api
    plan: free
    runtime: docker
    rootDir: Backend Server
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    dockerCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXUS_PROCESS_ROLE
        value: all
      - key: NEXUS_STRICT_STARTUP
        value: "true"
      - key: NEXUS_REQUIRE_BILLING
        value: "true"
      - key: NEXUS_REQUIRE_DISTRIBUTED_RATE_LIMITING
        value: "true"
      - key: NEXUS_HORIZONTAL_SCALING
        value: "false"
      # Jobs run only while the free API is awake; there is no paid worker.
      - key: WEBHOOK_WORKER_ENABLED
        value: "true"
      - key: AUTOMATION_WORKER_ENABLED
        value: "true"
      - key: REPORT_SCHEDULER_ENABLED
        value: "true"
      - key: RETENTION_WORKER_ENABLED
        value: "true"
      - key: ACCOUNT_DELETION_WORKER_ENABLED
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_PRO_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_PRO_ANNUAL
        sync: false
      - key: RAZORPAY_PLAN_ENT_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_ENT_ANNUAL
        sync: false
      - key: SIGNUP_PROOF_SECRET
        generateValue: true
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SERVICE_SID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: NEXUS_AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: WEBHOOK_ENCRYPTION_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
